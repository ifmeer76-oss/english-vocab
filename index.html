<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나만의 영어 단어 마스터</title>
    <style>
        /* ===== 다크 테마 고정 ===== */
        :root {
            --bg: #111214;
            --card: #1e1f22;
            --card2: #26282c;
            --border: #3a3c40;
            --text: #d4d5d8;
            --text-sub: #7a7d85;
            --accent: #4a90e2;
            --accent2: #357abd;
            --orange: #e67e22;
            --green: #27ae60;
            --red: #e74c3c;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 10px;
            text-align: center;
            overflow-x: hidden;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            max-width: 850px;
            margin: 12px auto 0 auto;
            background: var(--card);
            padding: 16px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        h1 { font-size: 40px; margin-bottom: 15px; color: var(--text); }
        h2 { font-size: 32px; color: var(--accent); }

        /* 범위 설정 */
        .range-selector-box {
            background-color: var(--card2);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px dashed var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .range-selector-box label { font-size: 16px; font-weight: bold; }
        .range-input {
            width: 70px !important;
            font-size: 18px !important;
            padding: 6px !important;
            text-align: center;
            margin-bottom: 0 !important;
            border: 2px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
        }
        .range-btn {
            font-size: 16px;
            padding: 8px 16px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .range-btn:hover { background-color: var(--accent2); }
        .current-range-info {
            font-size: 14px;
            color: var(--text-sub);
            margin-top: 5px;
            font-weight: bold;
        }

        /* 단계 메뉴 */
        .stage-menu-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            background-color: var(--card2);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .stage-menu-btn {
            font-size: 15px;
            padding: 8px 16px;
            background-color: var(--card);
            color: var(--text-sub);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .stage-menu-btn:hover { background-color: var(--card2); color: var(--text); }
        .stage-menu-btn.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent2);
        }

        /* ===== 기본값 = 모바일 우선 ===== */
        .word-display { font-size: 48px; font-weight: bold; margin: 18px 0; min-height: 50px; word-break: break-word; color: var(--text); }
        .meaning-display { font-size: 28px; margin-bottom: 18px; min-height: 36px; color: var(--orange); }

        input[type="text"] {
            font-size: 22px;
            padding: 12px;
            width: 88%;
            border: 2px solid var(--border);
            border-radius: 10px;
            text-align: center;
            margin-bottom: 16px;
            background: var(--bg);
            color: var(--text);
        }
        input[type="text"]:focus { border-color: var(--accent); outline: none; }

        /* 빈칸 힌트 */
        .final-blank-hint {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 4px;
            margin: 18px 0;
            font-family: 'Courier New', Courier, monospace;
            color: #7dd3fc;
            background-color: var(--card2);
            padding: 12px;
            border-radius: 10px;
            display: inline-block;
            border: 1px dashed var(--border);
            white-space: pre-wrap;
            word-break: break-all;
        }

        button.nav-btn {
            font-size: 20px;
            padding: 14px 30px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 80%;
        }
        button.nav-btn:hover { background-color: var(--accent2); }

        .move-btn-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding: 0 6px;
        }
        button.side-btn {
            font-size: 16px;
            padding: 10px 18px;
            background-color: var(--card2);
            color: var(--text-sub);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        button.side-btn:hover:not(:disabled) { background-color: var(--border); color: var(--text); }
        button.side-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .message { font-size: 22px; margin: 16px 0; font-weight: bold; }

        hr { border-color: var(--border); }

        /* ===== 모바일 세부 조정 (600px 이하) ===== */
        @media (max-width: 600px) {
            body { padding: 8px; }
            .container { margin: 8px auto 0 auto; padding: 14px; border-radius: 12px; }
            h1 { font-size: 22px; margin-bottom: 8px; }
            h2 { font-size: 18px; }
            .range-selector-box { flex-wrap: wrap; gap: 5px; }
            .range-input { width: 52px !important; font-size: 15px !important; }
            .range-btn { font-size: 13px; padding: 6px 10px; }
            .stage-menu-bar { gap: 4px; padding: 6px; }
            .stage-menu-btn { font-size: 11px; padding: 6px 6px; }
            #round-table-section { font-size: 12px; }
            #round-table-section table { width: 100%; }
        }

        /* ===== PC 확대 (900px 이상) ===== */
        @media (min-width: 900px) {
            .container { margin: 80px auto 0 auto; padding: 40px; }
            h1 { font-size: 40px; margin-bottom: 15px; }
            h2 { font-size: 32px; }
            .word-display { font-size: 64px; margin: 28px 0; }
            .meaning-display { font-size: 40px; margin-bottom: 28px; }
            input[type="text"] { font-size: 28px; padding: 15px; width: 78%; }
            button.nav-btn { font-size: 26px; padding: 15px 50px; width: auto; }
            button.side-btn { font-size: 20px; padding: 12px 28px; }
            .final-blank-hint { font-size: 48px; letter-spacing: 6px; padding: 15px; }
            .message { font-size: 30px; margin: 20px 0; }
            .stage-menu-btn { font-size: 15px; padding: 8px 16px; }
        }

        /* 자기평가 버튼 */
        .eval-btn-group { display: flex; justify-content: center; gap: 12px; margin: 14px 0; flex-wrap: wrap; }
        .eval-btn {
            font-size: 18px; padding: 12px 20px;
            border: none; border-radius: 12px; cursor: pointer; font-weight: bold;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .eval-btn:hover { transform: scale(1.07); }
        .eval-btn.know   { background: #166534; color: #bbf7d0; }
        .eval-btn.unsure { background: #854d0e; color: #fef08a; }
        .eval-btn.no     { background: #7f1d1d; color: #fecaca; }
        @media (min-width: 900px) { .eval-btn { font-size: 22px; padding: 14px 30px; } }

        /* 회차 테이블 */
        #round-toggle-btn {
            font-size: 14px; padding: 5px 12px;
            background: var(--card2); border: 1px solid var(--border); border-radius: 6px;
            cursor: pointer; font-weight: bold; color: var(--text-sub);
            margin-left: 8px;
        }
        #round-table-section {
            background: var(--card2); border-radius: 10px;
            padding: 12px; margin-bottom: 10px;
            border: 1px solid var(--border);
        }
        #round-table-section table { border-collapse: collapse; width: auto; margin: 8px auto 0 auto; }
        #round-table-section th, #round-table-section td {
            border: 1px solid var(--border); padding: 5px 12px;
            text-align: center; font-size: 14px; color: var(--text);
        }
        #round-table-section th { background: #1e3a5f; color: #7dd3fc; font-weight: bold; }
        #round-table-section tr:hover td { background: var(--border); cursor: pointer; }
    </style>
</head>
<body>

<div class="container" id="main-card">
    <h1 id="main-title">👑 나만의 영어 단어 마스터</h1>
    
    <div class="range-selector-box">
        <label>📖 범위:</label>
        <input type="number" id="start-range" class="range-input" value="1" min="1" max="400"> ~
        <input type="number" id="end-range" class="range-input" value="150" min="1" max="400"> 번
        <button class="range-btn" onclick="applyWordRange()">적용</button>
        <button id="round-toggle-btn" onclick="toggleRoundTable()">📅 회차 보기</button>
        <div class="current-range-info" id="range-info" style="width:100%; margin-top:4px;">현재 설정: 전체 단어 공부 중</div>
    </div>

    <div id="round-table-section" style="display:none;">
        <b>📅 Jr E7-1 회차별 범위</b> — 행을 누르면 자동 적용!
        <table>
            <tr><th>회차</th><th>범위</th></tr>
            <tr onclick="setRound(1,33)"><td>1회</td><td>1 ~ 33</td></tr>
            <tr onclick="setRound(1,66)"><td>2회</td><td>1 ~ 66</td></tr>
            <tr onclick="setRound(1,99)"><td>3회</td><td>1 ~ 99</td></tr>
            <tr onclick="setRound(1,132)"><td>4회</td><td>1 ~ 132</td></tr>
            <tr onclick="setRound(34,165)"><td>5회</td><td>34 ~ 165</td></tr>
            <tr onclick="setRound(67,198)"><td>6회</td><td>67 ~ 198</td></tr>
            <tr onclick="setRound(100,231)"><td>7회</td><td>100 ~ 231</td></tr>
            <tr onclick="setRound(133,264)"><td>8회</td><td>133 ~ 264</td></tr>
            <tr onclick="setRound(166,298)"><td>9회</td><td>166 ~ 298</td></tr>
            <tr onclick="setRound(199,332)"><td>10회</td><td>199 ~ 332</td></tr>
            <tr onclick="setRound(232,366)"><td>11회</td><td>232 ~ 366</td></tr>
            <tr onclick="setRound(265,400)"><td>12회</td><td>265 ~ 400</td></tr>
        </table>
    </div>

    <div class="stage-menu-bar">
        <button class="stage-menu-btn" id="m-btn-1" onclick="jumpToStage(1)">👀 1단계 연습</button>
        <button class="stage-menu-btn" id="m-btn-2" onclick="jumpToStage(2)">✏️ 2단계 빈칸채우기</button>
        <button class="stage-menu-btn" id="m-btn-3" onclick="jumpToStage(3)">📝 3단계 완전입력</button>
        <button class="stage-menu-btn" id="m-btn-4" onclick="jumpToStage(4)">🔄 4단계 오답반복</button>
    </div>

    <hr style="border: 1px solid #eee; margin-bottom: 30px;">
    
    <div id="game-zone"></div>
</div>

<script src="words.js"></script>

<script>
const START_BOOK_NUMBER = 1;

function toggleRoundTable() {
    const sec = document.getElementById('round-table-section');
    sec.style.display = (sec.style.display === 'none') ? 'block' : 'none';
}

function setRound(s, e) {
    document.getElementById('start-range').value = s;
    document.getElementById('end-range').value = e;
    toggleRoundTable();
    applyWordRange();
}

let activeWords = [];
let currentIndex = 0;
let wrongWords = [];
let wrongCount = 1;
let stage1Step = "show_eng";
let currentStage = 1;
let selfEval = [];      // 1단계 자기평가: 각 단어별 'know'|'unsure'|'no'
let focusWords = [];    // 2단계부터 사용할 집중 단어 (unsure+no)

const zone = document.getElementById('game-zone');

function applyWordRange() {
    let startInput = parseInt(document.getElementById('start-range').value);
    let endInput = parseInt(document.getElementById('end-range').value);
    let infoEl = document.getElementById('range-info');

    if (isNaN(startInput) || isNaN(endInput)) {
        alert("시작 번호와 끝 번호를 숫자로 정확히 입력해 주세요!");
        return;
    }
    if (startInput > endInput) {
        alert("시작 번호가 끝 번호보다 클 수 없습니다!");
        return;
    }

    let startIndex = startInput - START_BOOK_NUMBER;
    let endIndex = endInput - START_BOOK_NUMBER;

    if (startIndex < 0 || endIndex >= words.length || startIndex > endIndex) {
        alert(`번호 범위 오류!\n현재 단어 범위: ${START_BOOK_NUMBER}번 ~ ${START_BOOK_NUMBER + words.length - 1}번`);
        return;
    }

    activeWords = words.slice(startIndex, endIndex + 1);
    infoEl.innerText = `현재 설정: [ ${startInput}번 ~ ${endInput}번 ] 총 ${activeWords.length}개 단어 집중 훈련 중!`;
    infoEl.style.color = "#e67e22";

    currentIndex = 0;
    wrongWords = [];
    selfEval = new Array(activeWords.length).fill(null);
    focusWords = [];
    startStage1();
}

function initGame() {
    if(typeof words !== 'undefined' && words.length > 0) {
        activeWords = [...words];
        document.getElementById('start-range').placeholder = START_BOOK_NUMBER;
        document.getElementById('end-range').placeholder = START_BOOK_NUMBER + words.length - 1;
    }
    currentIndex = 0;
    wrongWords = [];
    selfEval = new Array(activeWords.length).fill(null);
    focusWords = [];
    startStage1();
}

document.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        if (currentStage === 1) {
            // 자기평가 버튼이 표시 중일 땐 Enter 무시
            if (stage1Step === "show_eng") { handleStage1(); }
        }
        else if (currentStage === 2) { checkStage2(); }
        else if (currentStage === 3) { checkStage3(); }
        else if (currentStage === 4) { checkStage4(); }

    }
});

function speakWord(text) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
     utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
}

function updateMenuHighlight(stageNum) {
    for (let i = 1; i <= 4; i++) {
        document.getElementById(`m-btn-${i}`).classList.remove('active');
    }
    document.getElementById(`m-btn-${stageNum}`).classList.add('active');
}

function jumpToStage(stageNum) {
    currentIndex = 0;
    if (stageNum === 1) {
        startStage1();
    } else if (stageNum === 2) {
        startStage2();
    } else if (stageNum === 3) {
        startStage3();
    } else if (stageNum === 4) {
        if (wrongWords.length === 0 && activeWords.length > 0) {
            wrongWords.push({eng: activeWords[0].eng, kor: activeWords[0].kor + " (연습용)", blank: activeWords[0].blank});
        }
        wrongCount = 1;
        startStage4();
    }
}

function movePrev() {
    if (currentIndex > 0) {
        currentIndex--;
        if (currentStage === 1) startStage1();
        else if (currentStage === 3) startStage3();
    }
}

function moveNext() {
    if (currentIndex < activeWords.length - 1) {
        currentIndex++;
        if (currentStage === 1) startStage1();
        else if (currentStage === 3) startStage3();
    } else if (currentIndex === activeWords.length - 1 && currentStage === 1) {
        currentIndex = 0;
        startStage2();
    } else if (currentIndex === activeWords.length - 1 && currentStage === 3) {
        currentIndex++;
        startStage3();
    }
}

function startStage1() {
    currentStage = 1;
    updateMenuHighlight(1);
    
    if(activeWords.length === 0) {
        zone.innerHTML = "<h2>📖 상단 범위 설정에서 단어 범위를 입력하고 적용해 주세요!</h2>";
        return;
    }

    if(currentIndex < activeWords.length) {
        stage1Step = "show_eng";
        let originalIdx = words.indexOf(activeWords[currentIndex]);
        let bookNum = START_BOOK_NUMBER + originalIdx;
        let isFirst = currentIndex === 0 ? "disabled" : "";

        const evalMark = selfEval[currentIndex] === 'know' ? ' ✅' : selfEval[currentIndex] === 'unsure' ? ' 🤔' : selfEval[currentIndex] === 'no' ? ' ❌' : '';
        const engWord = activeWords[currentIndex].eng;
        zone.innerHTML = `
            <h2>👀 1단계: 뜻 맞히기 연습 (${bookNum}번) ${evalMark}</h2>
            <div style="font-size:13px;color:#94a3b8;margin-bottom:4px;">${currentIndex+1} / ${activeWords.length}</div>
            <div class="word-display">
                ${engWord}
                <button onclick="speakWord('${engWord.replace(/'/g,"\\'")}')" style="background:none;border:none;cursor:pointer;font-size:0.6em;vertical-align:middle;padding:0 4px;" title="발음 듣기">🔊</button>
            </div>
            <div id="meaning-box" class="meaning-display" style="opacity:0.5;font-size:28px;">버튼을 누르면 뜻이 나타납니다.</div>
            <button class="nav-btn" id="stage1-btn" onclick="handleStage1()">뜻 보기</button>
            <div id="eval-box"></div>
            <div class="move-btn-container">
                <button class="side-btn" onclick="movePrev()" ${isFirst}>◀ 뒤로</button>
                <button class="side-btn" onclick="moveNext()">앞으로 ▶</button>
            </div>
        `;
        speakWord(engWord);
    } else {
        currentIndex = 0;
        startStage2();
    }
}

function handleStage1() {
    let meaningBox = document.getElementById('meaning-box');
    let btn = document.getElementById('stage1-btn');
    let evalBox = document.getElementById('eval-box');

    if (stage1Step === "show_eng") {
        meaningBox.style.opacity = "1";
        meaningBox.style.fontSize = "36px";
        meaningBox.style.fontWeight = "bold";
        meaningBox.innerHTML = activeWords[currentIndex].kor;
        btn.style.display = "none";
        // 자기평가 버튼 표시
        evalBox.innerHTML = `
            <p style="font-size:16px;color:#64748b;margin:10px 0 6px;">이 단어, 얼마나 알고 있나요?</p>
            <div class="eval-btn-group">
                <button class="eval-btn know"   onclick="setEval('know')">✅ 알아요!</button>
                <button class="eval-btn unsure" onclick="setEval('unsure')">🤔 헷갈려요</button>
                <button class="eval-btn no"     onclick="setEval('no')">❌ 몰라요</button>
            </div>
        `;
        stage1Step = "show_kor";
    }
}

function setEval(result) {
    selfEval[currentIndex] = result;
    currentIndex++;
    if (currentIndex < activeWords.length) {
        startStage1();
    } else {
        // 1단계 완료 — 집중훈련 대상 계산
        focusWords = activeWords.filter((_, i) => selfEval[i] === 'unsure' || selfEval[i] === 'no');
        const knowCount   = selfEval.filter(v => v === 'know').length;
        const unsureCount = selfEval.filter(v => v === 'unsure').length;
        const noCount     = selfEval.filter(v => v === 'no').length;
        zone.innerHTML = `
            <h2>🎉 1단계 완료!</h2>
            <p style="font-size:20px;margin:10px 0;">
                ✅ 알아요: <b>${knowCount}</b>개 &nbsp;
                🤔 헷갈려요: <b>${unsureCount}</b>개 &nbsp;
                ❌ 몰라요: <b>${noCount}</b>개
            </p>
            ${focusWords.length > 0
                ? `<p style="font-size:17px;color:#e67e22;font-weight:bold;">🎯 헷갈리거나 모르는 단어 <b>${focusWords.length}</b>개로 집중훈련을 시작합니다!</p>
                   <button class="nav-btn" onclick="startFocusTraining()">🚀 집중훈련 시작!</button>`
                : `<p style="font-size:17px;color:#16a34a;font-weight:bold;">👏 모든 단어를 알고 있군요! 대단해요!</p>
                   <button class="nav-btn" onclick="goStage2All()">📝 2단계로 바로 가기</button>`
            }
            <br><br>
            <button class="side-btn" onclick="currentIndex=0;startStage1();" style="margin-top:8px;">🔄 1단계 다시 보기</button>
        `;
    }
}

function startFocusTraining() {
    // focusWords를 activeWords로 교체하고 2단계 시작
    activeWords = focusWords;
    currentIndex = 0;
    wrongWords = [];
    startStage2();
}

function goStage2All() {
    currentIndex = 0;
    wrongWords = [];
    startStage2();
}

function startStage2() {
    currentStage = 2;
    updateMenuHighlight(2);

    if(activeWords.length === 0) return;

    if(currentIndex < activeWords.length) {
        let originalIdx = words.indexOf(activeWords[currentIndex]);
        let bookNum = START_BOOK_NUMBER + originalIdx;
        let wordObj = activeWords[currentIndex];

        zone.innerHTML = `
            <h2>✏️ 2단계: 빈칸 채우기 (${bookNum}번)</h2>
            <p style="font-size:20px; opacity:0.8;">힌트를 보고 빠진 철자를 생각하며 단어 전체를 입력하세요!</p>
            <div class="meaning-display" style="font-size:45px; font-weight:bold;">뜻: ${wordObj.kor}</div>
            <div>
                <div class="final-blank-hint">${wordObj.blank}</div>
            </div>
            <input type="text" id="ans2" placeholder="단어 전체를 입력하세요" style="width:85%;" autocomplete="off">
            <br><button class="nav-btn" id="btn2" onclick="checkStage2()">정답 확인</button>
            <div id="msg2" class="message"></div>
        `;
        document.getElementById('ans2').focus();
    } else {
        currentIndex = 0;
        wrongWords = [];
        startStage3();
    }
}

function checkStage2() {
    let inputEl = document.getElementById('ans2');
    let btnEl = document.getElementById('btn2');
    if(!inputEl || inputEl.disabled) return;

    let userAns = inputEl.value.trim().toLowerCase();
    let correctAns = activeWords[currentIndex].eng.trim().toLowerCase();
    let msg = document.getElementById('msg2');

    if(userAns === correctAns) {
        inputEl.disabled = true;
        btnEl.disabled = true;
        msg.style.color = "green";
        msg.innerHTML = `통과! 🎉 <button onclick="speakWord('${activeWords[currentIndex].eng.replace(/'/g,"\\'")}') " style="background:none;border:none;cursor:pointer;font-size:22px;">🔊</button>`;
        speakWord(activeWords[currentIndex].eng);
        setTimeout(() => { currentIndex++; startStage2(); }, 1400);
    } else {
        msg.style.color = "red";
        msg.innerHTML = "철자가 틀렸거나 빠진 부분이 있습니다! 힌트를 보고 다시 신중하게 입력해 보세요.";
        inputEl.focus();
    }
}

function startStage3() {
    currentStage = 3;
    updateMenuHighlight(3);

    if(activeWords.length === 0) return;

    if(currentIndex < activeWords.length) {
        let originalIdx = words.indexOf(activeWords[currentIndex]);
        let bookNum = START_BOOK_NUMBER + originalIdx;
        let isFirst = currentIndex === 0 ? "disabled" : "";

        zone.innerHTML = `
            <h2>📝 3단계: 뜻 보고 영어 완전 입력 (${bookNum}번)</h2>
            <p style="font-size:22px; color:#ff6b6b; font-weight:bold;">★ 힌트 없이! 뜻만 보고 영어 단어를 정확하게 치세요! ★</p>
            <div class="meaning-display" style="font-size:50px; font-weight:bold;">뜻: ${activeWords[currentIndex].kor}</div>
            <input type="text" id="ans3" placeholder="영어 단어 입력" autocomplete="off">
            <br><button class="nav-btn" id="btn3" onclick="checkStage3()">정답 확인</button>
            <div id="msg3" class="message"></div>

            <div class="move-btn-container">
                <button class="side-btn" onclick="movePrev()" ${isFirst}>◀ 뒤로가기</button>
                <button class="side-btn" onclick="moveNext()">앞으로가기 ▶</button>
            </div>
        `;
        document.getElementById('ans3').focus();
    } else {
        if(wrongWords.length > 0) {
            wrongCount = 1;
            startStage4();
        } else {
            zone.innerHTML = `
                <h1 style="color:#27ae60; font-size:60px;">🏆 미션 컴플리트! 🏆</h1>
                <p style="font-size:35px; font-weight:bold;">선택하신 시험 범위 단어 공부를 모두 끝마쳤습니다! 최고예요!</p>
                <br><button class="nav-btn" onclick="initGame()">전체 단어 다시 공부하기</button>
            `;
        }
    }
}

function checkStage3() {
    let inputEl = document.getElementById('ans3');
    let btnEl = document.getElementById('btn3');
    if(!inputEl || inputEl.disabled) return;

    let userAns = inputEl.value.trim().toLowerCase();
    let correctAns = activeWords[currentIndex].eng.trim().toLowerCase();
    let msg = document.getElementById('msg3');

    inputEl.disabled = true;
    btnEl.disabled = true;

    const eng = activeWords[currentIndex].eng;
    if(userAns === correctAns) {
        msg.style.color = "green";
        msg.innerHTML = `딩동댕! 정답입니다. 🎉 <button onclick="speakWord('${eng.replace(/'/g,"\\'")}') " style="background:none;border:none;cursor:pointer;font-size:22px;">🔊</button>`;
        speakWord(eng);
        setTimeout(() => { currentIndex++; startStage3(); }, 1250);
    } else {
        msg.style.color = "red";
        msg.innerHTML = `땡! 정답은 [ ${eng} ] 입니다. 😢 <button onclick="speakWord('${eng.replace(/'/g,"\\'")}') " style="background:none;border:none;cursor:pointer;font-size:22px;">🔊</button>
            <br><button class="nav-btn" style="margin-top:12px;" onclick="nextAfterWrong3()">다음으로 ▶</button>`;
        speakWord(eng);
        if(!wrongWords.includes(activeWords[currentIndex])) {
            wrongWords.push(activeWords[currentIndex]);
        }
    }
}

function nextAfterWrong3() {
    currentIndex++;
    startStage3();
}

function startStage4() {
    currentStage = 4;
    updateMenuHighlight(4);

    if(wrongWords.length > 0) {
        let currentWord = wrongWords[0];
        zone.innerHTML = `
            <h2>🔄 4단계: 오답 무한 반복 모드 [4-${wrongCount}]</h2>
            <p style="font-size:20px; opacity:0.8;">틀린 단어를 확실하게 외워봅시다!</p>
            <div class="meaning-display" style="font-size:50px; font-weight:bold;">뜻: ${currentWord.kor}</div>
            <input type="text" id="ans4" placeholder="영어 단어 다시 입력" autocomplete="off">
            <br><button class="nav-btn" id="btn4" onclick="checkStage4()">정답 확인</button>
            <div id="msg4" class="message"></div>
        `;
        document.getElementById('ans4').focus();
    } else {
        zone.innerHTML = `
            <h1 style="color:#27ae60; font-size:60px;">🏆 미션 컴플리트! 🏆</h1>
            <p style="font-size:35px; font-weight:bold;">선택하신 시험 범위 단어 공부를 모두 끝마쳤습니다! 최고예요!</p>
            <br><button class="nav-btn" onclick="initGame()">전체 단어 다시 공부하기</button>
        `;
    }
}

function checkStage4() {
    let inputEl = document.getElementById('ans4');
    let btnEl = document.getElementById('btn4');
    if(!inputEl || inputEl.disabled) return;

    let userAns = inputEl.value.trim().toLowerCase();
    let currentWord = wrongWords.shift();
    let correctAns = currentWord.eng.trim().toLowerCase();
    let msg = document.getElementById('msg4');

    inputEl.disabled = true;
    btnEl.disabled = true;

    const eng4 = currentWord.eng;
    if(userAns === correctAns) {
        msg.style.color = "green";
        msg.innerHTML = `좋아요! 이번엔 맞혔습니다. 👍 <button onclick="speakWord('${eng4.replace(/'/g,"\\'")}') " style="background:none;border:none;cursor:pointer;font-size:22px;">🔊</button>`;
        speakWord(eng4);
        wrongCount++;
        setTimeout(() => { startStage4(); }, 1200);
    } else {
        msg.style.color = "red";
        msg.innerHTML = `아직 못 외웠군요! 정답은 [ ${eng4} ] 입니다. 맨 뒤로 보냅니다. <button onclick="speakWord('${eng4.replace(/'/g,"\\'")}') " style="background:none;border:none;cursor:pointer;font-size:22px;">🔊</button>
            <br><button class="nav-btn" style="margin-top:12px;" onclick="nextAfterWrong4()">다음으로 ▶</button>`;
        speakWord(eng4);
        wrongWords.push(currentWord);
        wrongCount++;
    }
}

function nextAfterWrong4() {
    startStage4();
}

// 최초 초기화 함수 구동
initGame();
</script>

</body>
