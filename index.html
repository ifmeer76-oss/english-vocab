<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VOCAMAP Basic</title>
<style>
:root {
  --bg:       #0d0e10;
  --surface:  #16181c;
  --surface2: #1e2026;
  --border:   #2a2d35;
  --text:     #e8e9eb;
  --sub:      #5a5f6e;
  --accent:   #c9793a;
  --accent2:  #a85e28;
  --gold:     #d4a843;
  --green:    #3a9e6e;
  --blue:     #3a7ec9;
  --radius:   14px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── 헤더 ── */
header {
  width: 100%;
  max-width: 700px;
  padding: 28px 24px 0;
  display: flex;
  align-items: baseline;
  gap: 10px;
}
header h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--text);
}
header span {
  font-size: 13px;
  color: var(--sub);
  letter-spacing: 0.05em;
}

/* ── 범위 입력 박스 ── */
.range-box {
  width: 100%;
  max-width: 700px;
  margin: 20px 24px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.range-box label {
  font-size: 13px;
  color: var(--sub);
  white-space: nowrap;
}
.range-box input {
  width: 72px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 16px;
  text-align: center;
  padding: 7px 4px;
  outline: none;
  transition: border-color .2s;
}
.range-box input:focus { border-color: var(--accent); }
.range-sep { color: var(--sub); font-size: 18px; }
.range-info {
  margin-left: auto;
  font-size: 12px;
  color: var(--sub);
}
.btn-start {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  padding: 8px 20px;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: background .2s;
  white-space: nowrap;
}
.btn-start:hover { background: var(--accent2); }

/* ── 메인 학습 영역 ── */
#study-wrap {
  display: none;
  width: 100%;
  max-width: 700px;
  flex: 1;
  padding: 20px 16px 32px;
  position: relative;
}

/* 진행 바 (우측 세로) */
#progress-rail {
  position: fixed;
  right: max(16px, calc(50vw - 366px));
  top: 50%;
  transform: translateY(-50%);
  width: 4px;
  height: 240px;
  background: var(--border);
  border-radius: 4px;
  z-index: 10;
}
#progress-fill {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: var(--accent);
  border-radius: 4px;
  transition: height .4s ease;
}
#progress-label {
  position: absolute;
  top: -24px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: var(--sub);
  white-space: nowrap;
}
#progress-pct {
  position: absolute;
  bottom: -22px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: var(--accent);
  font-weight: 700;
  white-space: nowrap;
}

/* 단어 번호 뱃지 */
.word-badge {
  display: inline-block;
  font-size: 12px;
  color: var(--sub);
  letter-spacing: 0.06em;
  margin-bottom: 20px;
}

/* 카드 */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 36px 32px;
  min-height: 280px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0;
  transition: all .3s ease;
  position: relative;
}

/* 예문 */
.sentence-en {
  font-size: 22px;
  line-height: 1.6;
  color: var(--text);
  font-weight: 400;
  letter-spacing: 0.01em;
}
.sentence-ko {
  font-size: 16px;
  color: var(--sub);
  margin-top: 16px;
  line-height: 1.6;
  opacity: 0;
  transition: opacity .4s;
}
.sentence-ko.show { opacity: 1; }

/* 단어 표시 */
.word-en {
  font-size: 48px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
  opacity: 0;
  transition: opacity .4s;
}
.word-en.show { opacity: 1; }

.word-kor {
  font-size: 20px;
  color: var(--gold);
  margin-top: 12px;
  font-weight: 500;
  opacity: 0;
  transition: opacity .4s;
}
.word-kor.show { opacity: 1; }

/* 발음 버튼 */
.btn-speak {
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--sub);
  font-size: 13px;
  padding: 6px 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .2s;
  margin-top: 20px;
  align-self: flex-start;
  opacity: 0;
  pointer-events: none;
  transition: opacity .4s, border-color .2s, color .2s;
}
.btn-speak.show { opacity: 1; pointer-events: auto; }
.btn-speak:hover { border-color: var(--accent); color: var(--accent); }

/* 하단 컨트롤 */
.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 20px;
  gap: 12px;
}
.btn-nav {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  padding: 12px 24px;
  cursor: pointer;
  transition: all .2s;
  letter-spacing: 0.03em;
}
.btn-nav:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn-nav:disabled { opacity: 0.25; cursor: not-allowed; }
.btn-next {
  background: var(--accent);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  padding: 13px 32px;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: background .2s;
  flex: 1;
  max-width: 200px;
}
.btn-next:hover { background: var(--accent2); }

/* 단계 힌트 */
.step-hint {
  font-size: 12px;
  color: var(--sub);
  text-align: center;
  margin-top: 10px;
  letter-spacing: 0.03em;
}

/* 완료 화면 */
#done-screen {
  display: none;
  text-align: center;
  padding: 60px 24px;
}
#done-screen h2 { font-size: 32px; color: var(--gold); margin-bottom: 16px; }
#done-screen p { font-size: 16px; color: var(--sub); margin-bottom: 32px; }
.btn-restart {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  padding: 14px 36px;
  cursor: pointer;
}
.btn-restart:hover { background: var(--accent2); }

/* 로딩 */
#loading {
  display: none;
  color: var(--sub);
  font-size: 14px;
  padding: 40px;
  text-align: center;
}

/* 모바일 */
@media (max-width: 600px) {
  header { padding: 20px 16px 0; }
  header h1 { font-size: 18px; }
  .range-box { margin: 14px 16px 0; padding: 14px 16px; }
  .card { padding: 28px 22px; min-height: 240px; }
  .sentence-en { font-size: 18px; }
  .word-en { font-size: 36px; }
  #progress-rail { right: 10px; height: 180px; }
  .btn-next { padding: 12px 20px; font-size: 14px; }
}
</style>
</head>
<body>

<header>
  <h1>VOCAMAP</h1>
  <span>Basic · 1500</span>
</header>

<div class="range-box" id="range-box">
  <label>범위</label>
  <input type="number" id="inp-start" value="1" min="1" max="1500" placeholder="1">
  <span class="range-sep">–</span>
  <input type="number" id="inp-end" value="100" min="1" max="1500" placeholder="100">
  <span class="range-info" id="range-info">100단어</span>
  <button class="btn-start" onclick="startStudy()">시작</button>
</div>

<div id="loading">데이터 로딩 중...</div>

<div id="study-wrap">
  <div id="progress-rail">
    <span id="progress-label">0 / 0</span>
    <div id="progress-fill" style="height:0%"></div>
    <span id="progress-pct">0%</span>
  </div>

  <div class="word-badge" id="word-badge">001</div>

  <div class="card" id="card">
    <div class="sentence-en" id="sent-en"></div>
    <div class="sentence-ko" id="sent-ko"></div>
    <div class="word-en" id="word-en"></div>
    <div class="word-kor" id="word-kor"></div>
    <button class="btn-speak" id="btn-speak" onclick="speakCurrent()">🔊 발음 듣기</button>
  </div>

  <div class="step-hint" id="step-hint">엔터 또는 다음을 눌러 계속</div>

  <div class="controls">
    <button class="btn-nav" id="btn-prev" onclick="goPrev()" disabled>◀ 이전</button>
    <button class="btn-next" id="btn-next" onclick="goNext()">다음 ▶</button>
  </div>
</div>

<div id="done-screen">
  <h2>🏆 완료!</h2>
  <p id="done-msg"></p>
  <button class="btn-restart" onclick="backToRange()">처음으로</button>
</div>

<script>
// ── 상태 ──
let activeWords = [];
let idx = 0;      // 현재 단어 인덱스
let step = 0;     // 0=예문, 1=예문번역, 2=단어+TTS, 3=단어뜻
let loadedParts = {};

// ── 범위 정보 업데이트 ──
function updateRangeInfo() {
  const s = parseInt(document.getElementById('inp-start').value) || 1;
  const e = parseInt(document.getElementById('inp-end').value) || 100;
  const cnt = Math.max(0, e - s + 1);
  document.getElementById('range-info').textContent = cnt + '단어';
}
document.getElementById('inp-start').addEventListener('input', updateRangeInfo);
document.getElementById('inp-end').addEventListener('input', updateRangeInfo);

// ── 파트 번호 계산 (100단어씩) ──
function partNumFor(wordNum) {
  return Math.ceil(wordNum / 100);
}

// ── 파트 로드 ──
function loadPart(partNum) {
  return new Promise((resolve, reject) => {
    if (loadedParts[partNum]) { resolve(); return; }
    const s = document.createElement('script');
    const pStr = String(partNum).padStart(2, '0');
    s.src = `part${pStr}.js`;
    s.onload = () => { loadedParts[partNum] = true; resolve(); };
    s.onerror = () => reject(new Error('part' + pStr + ' 로드 실패'));
    document.head.appendChild(s);
  });
}

// ── 시작 ──
async function startStudy() {
  const s = parseInt(document.getElementById('inp-start').value);
  const e = parseInt(document.getElementById('inp-end').value);

  if (isNaN(s) || isNaN(e) || s < 1 || e > 1500 || s > e) {
    alert('1 ~ 1500 범위 내에서 시작 ≤ 끝 으로 입력해 주세요.');
    return;
  }

  document.getElementById('loading').style.display = 'block';
  document.getElementById('range-box').style.display = 'none';

  // 필요한 파트 로드
  const startPart = partNumFor(s);
  const endPart   = partNumFor(e);
  const loads = [];
  for (let p = startPart; p <= endPart; p++) loads.push(loadPart(p));

  try {
    await Promise.all(loads);
  } catch(err) {
    alert('단어 파일을 불러오지 못했습니다.\n' + err.message);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('range-box').style.display = 'flex';
    return;
  }

  // wordData는 각 파트 js에서 전역 배열로 등록
  // 전체 합친 뒤 범위 필터
  activeWords = (window.allWordData || []).filter(w => w.num >= s && w.num <= e);

  document.getElementById('loading').style.display = 'none';

  if (activeWords.length === 0) {
    alert('해당 범위에 단어가 없습니다. 단어 파일을 확인해 주세요.');
    document.getElementById('range-box').style.display = 'flex';
    return;
  }

  idx = 0; step = 0;
  document.getElementById('study-wrap').style.display = 'block';
  document.getElementById('done-screen').style.display = 'none';
  renderCard();
}

// ── 카드 렌더 ──
function renderCard() {
  const w = activeWords[idx];

  document.getElementById('word-badge').textContent =
    String(w.num).padStart(3, '0') + '  ·  ' + (idx + 1) + ' / ' + activeWords.length;

  // 초기화
  document.getElementById('sent-en').textContent  = w.sentence || '—';
  document.getElementById('sent-ko').textContent  = w.sentenceKor || '—';
  document.getElementById('word-en').textContent  = w.eng;
  document.getElementById('word-kor').textContent = w.kor;

  // 단계별 표시
  const sentKo  = document.getElementById('sent-ko');
  const wordEn  = document.getElementById('word-en');
  const wordKor = document.getElementById('word-kor');
  const btnSpk  = document.getElementById('btn-speak');

  sentKo .classList.toggle('show', step >= 1);
  wordEn .classList.toggle('show', step >= 2);
  wordKor.classList.toggle('show', step >= 3);
  btnSpk .classList.toggle('show', step >= 2);

  // 힌트
  const hints = ['예문을 읽어보세요', '번역 확인', '단어 확인', '뜻 확인 — 다음 단어로'];
  document.getElementById('step-hint').textContent = hints[step] || '';

  // 이전 버튼
  document.getElementById('btn-prev').disabled = (idx === 0 && step === 0);

  // 다음 버튼 텍스트
  const nextBtn = document.getElementById('btn-next');
  if (step === 3 && idx === activeWords.length - 1) {
    nextBtn.textContent = '완료 ✓';
  } else if (step < 3) {
    nextBtn.textContent = '다음 ▶';
  } else {
    nextBtn.textContent = '다음 단어 ▶';
  }

  updateProgress();

  // step 0: 자동 TTS (예문)
  if (step === 0) {
    speak(w.sentence || w.eng, 'en-US');
  }
  // step 2: 단어 TTS
  if (step === 2) {
    speak(w.eng, 'en-US');
  }
}

// ── 다음 ──
function goNext() {
  if (step < 3) {
    step++;
    renderCard();
  } else {
    if (idx < activeWords.length - 1) {
      idx++; step = 0;
      renderCard();
    } else {
      showDone();
    }
  }
}

// ── 이전 ──
function goPrev() {
  if (step > 0) {
    step--;
  } else if (idx > 0) {
    idx--; step = 3;
  }
  renderCard();
}

// ── 현재 단어 발음 ──
function speakCurrent() {
  const w = activeWords[idx];
  speak(w.eng, 'en-US');
}

// ── TTS ──
function speak(text, lang) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'en-US';
  u.rate = 0.88;
  window.speechSynthesis.speak(u);
}

// ── 진행 바 ──
function updateProgress() {
  const total = activeWords.length;
  const done  = idx; // 완전히 마친 단어 수
  const pct   = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-fill').style.height = pct + '%';
  document.getElementById('progress-label').textContent = done + ' / ' + total;
  document.getElementById('progress-pct').textContent   = pct + '%';
}

// ── 완료 ──
function showDone() {
  document.getElementById('study-wrap').style.display = 'none';
  document.getElementById('done-screen').style.display = 'block';
  const s = activeWords[0].num;
  const e = activeWords[activeWords.length - 1].num;
  document.getElementById('done-msg').textContent =
    s + '번 ~ ' + e + '번  ' + activeWords.length + '단어 완료!';
}

function backToRange() {
  document.getElementById('done-screen').style.display = 'none';
  document.getElementById('range-box').style.display = 'flex';
  updateRangeInfo();
}

// ── 키보드 ──
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft') goPrev();
});
</script>
</body>
</html>
